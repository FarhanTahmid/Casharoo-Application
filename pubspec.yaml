name: casharoo
description: "Casharoo: personal money tracker and business cashbook."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  cupertino_icons: ^1.0.8
  http: ^1.5.0
  flutter_secure_storage: ^9.2.4
  google_sign_in: ^7.2.0

  # State and navigation
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0

  # Local database (the app reads and writes here; sync runs in the background)
  drift: ^2.28.0
  drift_flutter: ^0.2.4
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1

  # 1.1 needs a newer Flutter than 3.32 (vector_math 2.2)
  fl_chart: 1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.5.4
  sqlite3: ^2.9.4
  flutter_launcher_icons: 0.14.4

flutter:
  # Plain `flutter run` (and VS Code Run Without Debugging) builds this flavour.
  default-flavor: dev
  uses-material-design: true
  # Generates AppLocalizations from lib/l10n/*.arb
  generate: true

  assets:
    - assets/application_logos/png-transparent-google-logo-google-text-trademark-logo.png

  fonts:
    # Covers Bengali and Latin, so text looks the same on every device
    - family: HindSiliguri
      fonts:
        - asset: fonts/HindSiliguri/HindSiliguri-Regular.ttf
        - asset: fonts/HindSiliguri/HindSiliguri-Medium.ttf
          weight: 500
        - asset: fonts/HindSiliguri/HindSiliguri-SemiBold.ttf
          weight: 600
        - asset: fonts/HindSiliguri/HindSiliguri-Bold.ttf
          weight: 700
