# Spendroo icon for the staging flavour; regenerate with tool/make_icons.py, then
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  remove_alpha_ios: true
  image_path: assets/icon/icon_staging.png
  adaptive_icon_background: "#E6DCFF"
  adaptive_icon_foreground: assets/icon/foreground_staging.png
  # The brand kit's foreground already leaves the safe-zone margin
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/icon/source/monochrome-1024.png
  min_sdk_android: 24
